# Config for the fintech_disputes vertical. Inherits every unset value from the
# engine defaults in ftspec/config.py.
profile: "fintech_disputes"

model:
  base_model: "unsloth/Meta-Llama-3.1-8B-Instruct-bnb-4bit"
  max_seq_length: 2048
  load_in_4bit: true

data:
  root: "data"

training:
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  optim: "adamw_8bit"
  train_on_responses_only: true

preflight:
  max_prompt_tokens: 1536
  max_total_tokens: 2048
